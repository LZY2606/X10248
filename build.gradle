plugins {
    id 'java'
    id 'application'
}

group = 'org.polarreview'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.3.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'org.ejml:ejml-core:0.44'
    implementation 'org.ejml:ejml-fdense:0.44'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.slf4j:slf4j-simple:2.0.13'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.polarreview.app.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('generateCase', JavaExec) {
    group = 'polarreview'
    description = 'Regenerates the built-in offline polarimetry case pack.'
    mainClass = 'org.polarreview.app.GenerateCase'
    classpath = sourceSets.main.runtimeClasspath
}
