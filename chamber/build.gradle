plugins {
    id 'java'
    id 'application'
}

group = 'local.polar'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'org.xerial:sqlite-jdbc:3.47.2.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'org.ejml:ejml-core:0.45.1'
    implementation 'org.ejml:ejml-ddense:0.45.1'
    implementation 'org.ejml:ejml-simple:0.45.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'local.polar.chamber.App'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'local.polar.chamber.App'
    }
}
